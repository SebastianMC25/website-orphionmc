<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrphionMC - Staff Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css?v=59">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
        }

        .staff-container {
            max-width: 1400px;
            margin: 100px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }

        .staff-sidebar {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            height: fit-content;
        }

        .staff-nav {
            list-style: none;
            padding: 0;
        }

        .staff-nav li {
            margin-bottom: 10px;
        }

        .staff-nav button {
            width: 100%;
            border: none;
            background: transparent;
            color: #aaa;
            text-align: left;
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .staff-nav button.active {
            background: var(--gold);
            color: #000;
        }

        .staff-nav button:hover:not(.active) {
            background: #222;
            color: #fff;
        }

        .staff-section {
            display: none;
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
        }

        .staff-section.active {
            display: block;
        }

        .staff-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #222;
            text-align: center;
        }

        .stat-box h4 {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-box p {
            font-size: 2.5rem;
            color: var(--gold);
            font-weight: 900;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #333;
            color: var(--gold);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #111;
            font-size: 0.9rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .badge-admin {
            background: #c62828;
            color: #fff;
        }

        .badge-staff {
            background: #1565c0;
            color: #fff;
        }

        .badge-mod {
            background: #2e7d32;
            color: #fff;
        }

        .badge-banned {
            background: #000;
            color: #f44336;
            border: 1px solid #f44336;
        }

        .btn-sm {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-sm:hover {
            border-color: var(--gold);
        }

        .btn-ban {
            background: #8e1c1c;
            border-color: #c62828;
        }

        .log-entry {
            padding: 10px;
            border-bottom: 1px solid #111;
            font-size: 0.85rem;
        }

        .log-date {
            color: #666;
            font-size: 0.75rem;
            margin-right: 15px;
        }

        .log-staff {
            color: var(--gold);
            font-weight: bold;
        }
    </style>
</head>

<body class="section-bg-dark">
    <!-- Navbar injected by auth.js -->
    <nav class="navbar" id="main-nav">
        <div class="navbar-container">
            <div class="navbar-socials">
                <a href="https://discord.gg/orphionmc" target="_blank" rel="noopener" title="Discord"><i class="fa-brands fa-discord"></i></a>
                <a href="https://www.youtube.com/channel/UCxnTxY8q4eg3RpkwvY2btPw" target="_blank" rel="noopener" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>

            <div class="navbar-brand-centered" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: max-content; max-width: 90vw; z-index: 100;">
                <a href="index.html" class="logo" style="text-decoration: none; color: var(--gold); font-family: 'MedievalSharp', cursive, serif; font-size: 1.6rem; letter-spacing: 1.5px; line-height: 1.1; margin-bottom: 2px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); display: inline-block;">OrphionMC</a>
                <ul class="nav-links" style="display: flex; align-items: center; justify-content: center; gap: 8px; list-style: none; margin: 0; padding: 0;">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="forum.html">Foro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="staff-container" style="margin-top: 110px;">
        <aside class="staff-sidebar">
            <h2 style="color: var(--gold); margin-bottom: 25px; font-family: MedievalSharp;">OrphionMC OPS</h2>
            <ul class="staff-nav">
                <li><button type="button" onclick="showSection('overview')" id="nav-overview" class="active"><i
                            class="fa fa-chart-line" style="pointer-events:none;"></i> Resumen</button></li>
                <li><button type="button" onclick="showSection('users')" id="nav-users"><i class="fa fa-users" style="pointer-events:none;"></i> Usuarios</button>
                </li>
                <li><button type="button" onclick="showSection('moderation')" id="nav-moderation"><i class="fa fa-gavel" style="pointer-events:none;"></i>
                        Moderación</button></li>
                <li><button type="button" onclick="showSection('logs')" id="nav-logs"><i class="fa fa-list" style="pointer-events:none;"></i> Logs de
                        Auditoría</button></li>
            </ul>
        </aside>

        <main class="staff-content">
            <!-- Overview -->
            <section id="section-overview" class="staff-section active">
                <h3>Resumen General</h3>
                <div class="staff-stat-grid">
                    <div class="stat-box">
                        <h4>Usuarios</h4>
                        <p id="stat-users">-</p>
                    </div>
                    <div class="stat-box">
                        <h4>Hilos Hoy</h4>
                        <p id="stat-threads">-</p>
                    </div>
                    <div class="stat-box">
                        <h4>Mensajes</h4>
                        <p id="stat-posts">-</p>
                    </div>
                </div>
                <div class="staff-card">
                    <h4>Actividad Crítica Reciente</h4>
                    <div id="recent-activity-list" style="margin-top:20px;">Cargando...</div>
                </div>
            </section>

            <!-- Users Management -->
            <section id="section-users" class="staff-section">
                <h3>Control de Usuarios</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rango</th>
                            <th>Minecraft</th>
                            <th>Baneado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </section>

            <!-- Moderation -->
            <section id="section-moderation" class="staff-section">
                <h3>Gestión de Hilos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="mod-tbody"></tbody>
                </table>
            </section>

            <!-- Logs -->
            <section id="section-logs" class="staff-section">
                <h3>Registro de Auditoría</h3>
                <div id="logs-container"></div>
            </section>
        </main>
    </div>

    <script src="js/config.js?v=59"></script>
    <script src="js/auth.js?v=59"></script>
    <script>
        const API_URL = (window.CONFIG && window.CONFIG.API_BASE) ? window.CONFIG.API_BASE : 'https://api.orphionmc.net/api';

        // Check staff access
        let currentStaff = null;
        try {
            currentStaff = JSON.parse(localStorage.getItem('user'));
        } catch(e) {}

        if (!currentStaff || !['admin', 'moderator', 'staff'].includes(currentStaff.role)) {
            alert("Acceso denegado: este panel es exclusivo para Administradores y Staff.");
            window.location.href = 'forum.html';
        }

        function showSection(id) {
            document.querySelectorAll('.staff-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.staff-nav button').forEach(b => b.classList.remove('active'));
            
            const targetSection = document.getElementById(`section-${id}`);
            const targetBtn = document.getElementById(`nav-${id}`);
            if (targetSection) targetSection.classList.add('active');
            if (targetBtn) targetBtn.classList.add('active');

            if (id === 'overview') loadStats();
            else if (id === 'users') loadUsers();
            else if (id === 'moderation') loadModeration();
            else if (id === 'logs') loadLogs();
        }

        async function apiCall(path, method = 'GET', body = null) {
            const options = {
                method,
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                credentials: 'include'
            };
            const token = localStorage.getItem('auth_token');
            if (token) options.headers['Authorization'] = `Bearer ${token}`;
            if (body) options.body = JSON.stringify(body);

            const fetchFn = window.authFetch || fetch;
            const res = await fetchFn(`${API_URL}${path}`, options);
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: 'Error en la petición' }));
                throw new Error(err.error || err.message || 'Error en petición');
            }
            return res.json();
        }

        async function loadStats() {
            try {
                const stats = await apiCall('/staff/stats');
                document.getElementById('stat-users').innerText = stats.totalUsers ?? 0;
                document.getElementById('stat-threads').innerText = stats.threadsToday ?? 0;
                document.getElementById('stat-posts').innerText = stats.totalPosts ?? 0;

                const logs = await apiCall('/staff/logs');
                const list = document.getElementById('recent-activity-list');
                const safeLogs = Array.isArray(logs) ? logs : [];
                list.innerHTML = safeLogs.slice(0, 5).map(l => {
                    const safeStaff = window.escapeHTML(l.staff_name || 'Staff');
                    const safeAction = window.escapeHTML(l.action || 'acción');
                    const safeTarget = window.escapeHTML(l.target_type || 'elemento');
                    const safeId = encodeURIComponent(l.target_id || 0);
                    return `
                        <div class="log-entry">
                            <span class="log-staff">${safeStaff}</span> ejecutó <b>${safeAction}</b> en ${safeTarget} #${safeId}
                        </div>
                    `;
                }).join('') || 'Sin actividad reciente.';
            } catch (e) {
                console.error("Error cargando stats:", e);
                const list = document.getElementById('recent-activity-list');
                if (list) list.innerHTML = `<p style="color:#ff6b6b;"><i class="fa fa-triangle-exclamation"></i> ${window.escapeHTML(e.message)}</p>`;
            }
        }

        async function loadUsers() {
            const tbody = document.getElementById('users-tbody');
            if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#aaa;"><i class="fa fa-spinner fa-spin"></i> Cargando usuarios...</td></tr>';
            try {
                const users = await apiCall('/staff/users');
                if (!Array.isArray(users) || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#888;">No hay usuarios registrados.</td></tr>';
                    return;
                }
                tbody.innerHTML = users.map(u => {
                    const safeUsername = window.escapeHTML(u.username);
                    const safeRole = window.escapeHTML(u.role || 'user');
                    const safeIgn = u.minecraft_ign ? window.escapeHTML(u.minecraft_ign) : '---';
                    const safeId = parseInt(u.id, 10);
                    const isBanned = Boolean(u.is_banned);
                    return `
                        <tr>
                            <td><b>${safeUsername}</b></td>
                            <td><span class="badge badge-${safeRole}">${safeRole.toUpperCase()}</span></td>
                            <td>${safeIgn}</td>
                            <td>${isBanned ? '<span class="badge badge-banned">SÍ</span>' : 'NO'}</td>
                            <td>
                                <button onclick="toggleBan(${safeId}, ${isBanned})" class="btn-sm ${isBanned ? '' : 'btn-ban'}">
                                    ${isBanned ? 'DESBAN' : 'BAN'}
                                </button>
                                <button onclick="changeRole(${safeId})" class="btn-sm">RANGO</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error("Error cargando usuarios:", e);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff6b6b; padding:20px;"><i class="fa fa-triangle-exclamation"></i> Error al cargar usuarios: ${window.escapeHTML(e.message)}</td></tr>`;
            }
        }

        async function loadModeration() {
            const tbody = document.getElementById('mod-tbody');
            if (tbody) tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#aaa;"><i class="fa fa-spinner fa-spin"></i> Cargando hilos...</td></tr>';
            try {
                const threads = await apiCall('/staff/moderation/threads');
                if (!Array.isArray(threads) || threads.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#888;">No hay temas para moderar.</td></tr>';
                    return;
                }
                tbody.innerHTML = threads.map(t => {
                    const safeTitle = window.escapeHTML(t.title);
                    const safeStatus = window.escapeHTML(t.status || 'open');
                    const safeId = parseInt(t.id, 10);
                    return `
                        <tr>
                            <td><a href="view_thread.html?id=${safeId}" target="_blank" style="color:#eee; text-decoration:none;">${safeTitle}</a></td>
                            <td><span class="badge">${safeStatus.toUpperCase()}</span></td>
                            <td>${new Date(t.created_at).toLocaleDateString()}</td>
                            <td>
                                <button onclick="deleteThread(${safeId})" class="btn-sm btn-ban"><i class="fa fa-trash"></i> ELIMINAR</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error("Error cargando moderación:", e);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#ff6b6b; padding:20px;"><i class="fa fa-triangle-exclamation"></i> Error al cargar moderación: ${window.escapeHTML(e.message)}</td></tr>`;
            }
        }

        async function loadLogs() {
            const container = document.getElementById('logs-container');
            if (container) container.innerHTML = '<p style="text-align:center; padding:20px; color:#aaa;"><i class="fa fa-spinner fa-spin"></i> Cargando logs...</p>';
            try {
                const logs = await apiCall('/staff/logs');
                if (!Array.isArray(logs) || logs.length === 0) {
                    container.innerHTML = '<p style="color:#888; text-align:center; padding:20px;">No hay registros de auditoría aún.</p>';
                    return;
                }
                container.innerHTML = logs.map(l => {
                    const safeStaff = window.escapeHTML(l.staff_name || 'Staff');
                    const safeAction = window.escapeHTML(l.action || 'Acción');
                    const safeTarget = window.escapeHTML(l.target_type || 'Elemento');
                    const safeId = encodeURIComponent(l.target_id || 0);
                    const safeDetails = window.escapeHTML(l.details || '');
                    return `
                        <div class="log-entry">
                            <span class="log-date">${new Date(l.created_at).toLocaleString()}</span>
                            <span class="log-staff">${safeStaff}</span> &rarr; 
                            <b>${safeAction}</b> (${safeTarget} #${safeId})
                            ${safeDetails ? `<pre style="font-size:0.75rem; color:#aaa; margin-top:5px; background:#111; padding:6px; border-radius:4px;">${safeDetails}</pre>` : ''}
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Error cargando logs:", e);
                container.innerHTML = `<p style="color:#ff6b6b; text-align:center; padding:20px;"><i class="fa fa-triangle-exclamation"></i> Error al cargar logs: ${window.escapeHTML(e.message)}</p>`;
            }
        }

        async function toggleBan(id, isCurrentlyBanned) {
            if (!confirm(`¿Deseas ${isCurrentlyBanned ? 'desbanear' : 'banear'} a este usuario?`)) return;
            try {
                await apiCall(`/staff/users/${id}`, 'PUT', { is_banned: !isCurrentlyBanned });
                loadUsers();
            } catch (e) { alert(e.message); }
        }

        async function changeRole(id) {
            const newRole = prompt("Nuevo rango (user, moderator, staff, admin):");
            if (!['user', 'moderator', 'staff', 'admin'].includes(newRole)) return alert("Rango inválido.");
            try {
                await apiCall(`/staff/users/${id}`, 'PUT', { role: newRole });
                loadUsers();
            } catch (e) { alert(e.message); }
        }

        async function deleteThread(id) {
            if (!confirm("¿ESTÁS SEGURO? Esta acción es irreversible.")) return;
            try {
                await apiCall(`/staff/threads/${id}`, 'DELETE');
                loadModeration();
            } catch (e) { alert(e.message); }
        }

        // Initialize
        loadStats();
    </script>
</body>

</html>
