<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrphionMC - Staff Dashboard</title>
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
        }

        .staff-container {
            max-width: 1400px;
            margin: 100px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }

        .staff-sidebar {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            height: fit-content;
        }

        .staff-nav {
            list-style: none;
            padding: 0;
        }

        .staff-nav li {
            margin-bottom: 10px;
        }

        .staff-nav button {
            width: 100%;
            border: none;
            background: transparent;
            color: #aaa;
            text-align: left;
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .staff-nav button.active {
            background: var(--gold);
            color: #000;
        }

        .staff-nav button:hover:not(.active) {
            background: #222;
            color: #fff;
        }

        .staff-section {
            display: none;
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
        }

        .staff-section.active {
            display: block;
        }

        .staff-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #222;
            text-align: center;
        }

        .stat-box h4 {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-box p {
            font-size: 2.5rem;
            color: var(--gold);
            font-weight: 900;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #333;
            color: var(--gold);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #111;
            font-size: 0.9rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .badge-admin {
            background: #c62828;
            color: #fff;
        }

        .badge-staff {
            background: #1565c0;
            color: #fff;
        }

        .badge-mod {
            background: #2e7d32;
            color: #fff;
        }

        .badge-banned {
            background: #000;
            color: #f44336;
            border: 1px solid #f44336;
        }

        .btn-sm {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-sm:hover {
            border-color: var(--gold);
        }

        .btn-ban {
            background: #8e1c1c;
            border-color: #c62828;
        }

        .log-entry {
            padding: 10px;
            border-bottom: 1px solid #111;
            font-size: 0.85rem;
        }

        .log-date {
            color: #666;
            font-size: 0.75rem;
            margin-right: 15px;
        }

        .log-staff {
            color: var(--gold);
            font-weight: bold;
        }
    </style>
</head>

<body class="section-bg-dark">
    <div class="staff-container">
        <aside class="staff-sidebar">
            <h2 style="color: var(--gold); margin-bottom: 25px; font-family: MedievalSharp;">OrphionMC OPS</h2>
            <ul class="staff-nav">
                <li><button onclick="showSection('overview')" id="nav-overview" class="active"><i
                            class="fa fa-chart-line"></i> Resumen</button></li>
                <li><button onclick="showSection('users')" id="nav-users"><i class="fa fa-users"></i> Usuarios</button>
                </li>
                <li><button onclick="showSection('moderation')" id="nav-moderation"><i class="fa fa-gavel"></i>
                        Moderación</button></li>
                <li><button onclick="showSection('logs')" id="nav-logs"><i class="fa fa-list"></i> Logs de
                        Auditoría</button></li>
            </ul>
        </aside>

        <main class="staff-content">
            <!-- Overview -->
            <section id="section-overview" class="staff-section active">
                <h3>Resumen General</h3>
                <div class="staff-stat-grid">
                    <div class="stat-box">
                        <h4>Usuarios</h4>
                        <p id="stat-users">-</p>
                    </div>
                    <div class="stat-box">
                        <h4>Hilos Hoy</h4>
                        <p id="stat-threads">-</p>
                    </div>
                    <div class="stat-box">
                        <h4>Mensajes</h4>
                        <p id="stat-posts">-</p>
                    </div>
                </div>
                <div class="staff-card">
                    <h4>Actividad Crítica Reciente</h4>
                    <div id="recent-activity-list" style="margin-top:20px;">Cargando...</div>
                </div>
            </section>

            <!-- Users Management -->
            <section id="section-users" class="staff-section">
                <h3>Control de Usuarios</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rango</th>
                            <th>Minecraft</th>
                            <th>Baneado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </section>

            <!-- Moderation -->
            <section id="section-moderation" class="staff-section">
                <h3>Gestión de Hilos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="mod-tbody"></tbody>
                </table>
            </section>

            <!-- Logs -->
            <section id="section-logs" class="staff-section">
                <h3>Registro de Auditoría</h3>
                <div id="logs-container"></div>
            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script>
        const API_URL = window.CONFIG.API_BASE;

        function showSection(id) {
            document.querySelectorAll('.staff-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.staff-nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(`section-${id}`).classList.add('active');
            document.getElementById(`nav-${id}`).classList.add('active');

            if (id === 'overview') loadStats();
            if (id === 'users') loadUsers();
            if (id === 'moderation') loadModeration();
            if (id === 'logs') loadLogs();
        }

        async function apiCall(path, method = 'GET', body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include'
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(`${API_URL}${path}`, options);
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Error en petición');
            }
            return res.json();
        }

        async function loadStats() {
            try {
                const stats = await apiCall('/staff/stats');
                document.getElementById('stat-users').innerText = stats.totalUsers;
                document.getElementById('stat-threads').innerText = stats.threadsToday;
                document.getElementById('stat-posts').innerText = stats.totalPosts;

                const logs = await apiCall('/staff/logs');
                const list = document.getElementById('recent-activity-list');
                list.innerHTML = logs.slice(0, 5).map(l => `
                    <div class="log-entry">
                        <span class="log-staff">${l.staff_name}</span> ejecutó <b>${l.action}</b> en ${l.target_type} #${l.target_id}
                    </div>
                `).join('') || 'Sin actividad reciente.';
            } catch (e) { alert(e.message); }
        }

        async function loadUsers() {
            const users = await apiCall('/staff/users');
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td><span class="badge badge-${u.role}">${u.role.toUpperCase()}</span></td>
                    <td>${u.minecraft_ign || '---'}</td>
                    <td>${u.is_banned ? '<span class="badge badge-banned">SÍ</span>' : 'NO'}</td>
                    <td>
                        <button onclick="toggleBan(${u.id}, ${u.is_banned})" class="btn-sm ${u.is_banned ? '' : 'btn-ban'}">
                            ${u.is_banned ? 'DESBAN' : 'BAN'}
                        </button>
                        <button onclick="changeRole(${u.id})" class="btn-sm">RANGO</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadModeration() {
            const threads = await apiCall('/staff/moderation/threads');
            const tbody = document.getElementById('mod-tbody');
            tbody.innerHTML = threads.map(t => `
                <tr>
                    <td>${t.title}</td>
                    <td><span class="badge">${t.status.toUpperCase()}</span></td>
                    <td>${new Date(t.created_at).toLocaleDateString()}</td>
                    <td>
                        <button onclick="deleteThread(${t.id})" class="btn-sm btn-ban">ELIMINAR</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadLogs() {
            const logs = await apiCall('/staff/logs');
            const container = document.getElementById('logs-container');
            container.innerHTML = logs.map(l => `
                <div class="log-entry">
                    <span class="log-date">${new Date(l.created_at).toLocaleString()}</span>
                    <span class="log-staff">${l.staff_name}</span> -> 
                    <b>${l.action}</b> (${l.target_type} #${l.target_id})
                    <pre style="font-size:0.7rem; color:#888;">${l.details}</pre>
                </div>
            `).join('');
        }

        async function toggleBan(id, isCurrentlyBanned) {
            if (!confirm(`¿Deseas ${isCurrentlyBanned ? 'desbanear' : 'banear'} a este usuario?`)) return;
            try {
                await apiCall(`/staff/users/${id}`, 'PUT', { is_banned: !isCurrentlyBanned });
                loadUsers();
            } catch (e) { alert(e.message); }
        }

        async function changeRole(id) {
            const newRole = prompt("Nuevo rango (user, moderator, staff, admin):");
            if (!['user', 'moderator', 'staff', 'admin'].includes(newRole)) return alert("Rango inválido.");
            try {
                await apiCall(`/staff/users/${id}`, 'PUT', { role: newRole });
                loadUsers();
            } catch (e) { alert(e.message); }
        }

        async function deleteThread(id) {
            if (!confirm("¿ESTÁS SEGURO? Esta acción es irreversible.")) return;
            try {
                await apiCall(`/staff/threads/${id}`, 'DELETE');
                loadModeration();
            } catch (e) { alert(e.message); }
        }

        // Initialize
        loadStats();
    </script>
</body>

</html>
