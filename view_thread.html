<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Tema - OrphionMC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <style>
        .forum-hero {
            padding: 120px 20px 40px;
            text-align: left;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 2px solid var(--gold);
        }

        .forum-hero h1 {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .forum-hero .meta {
            color: #888;
            font-size: 0.9rem;
        }

        .thread-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .post {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 200px 1fr;
            border-radius: 8px;
            overflow: hidden;
        }

        .post-user {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-right: 1px solid #333;
        }

        .post-avatar {
            width: 100px;
            height: 100px;
            background: #333;
            margin: 0 auto 15px;
            border-radius: 4px;
            border: 2px solid #555;
        }

        .post-username {
            font-weight: bold;
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
        }

        .post-role {
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            background: #222;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        .post-content {
            padding: 20px;
            line-height: 1.6;
            min-height: 200px;
        }

        .post-footer {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #777;
        }

        .reply-box {
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid #333;
            border-radius: 12px;
        }

        .reply-box h3 {
            color: var(--gold);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            resize: vertical;
        }

        .btn-reply {
            background: var(--gold);
            color: #000;
            padding: 12px 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .post {
                grid-template-columns: 1fr;
            }

            .post-user {
                border-right: none;
                border-bottom: 1px solid #333;
                flex-direction: row;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 20px;
                padding: 15px;
            }

            .post-avatar {
                margin: 0;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <div class="video-bg"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <!-- Socials Left -->
            <div class="navbar-socials">
                <a href="https://discord.gg/orphionmc" target="_blank" rel="noopener" title="Discord"><i
                        class="fa-brands fa-discord"></i></a>
                <a href="https://www.youtube.com/channel/UCxnTxY8q4eg3RpkwvY2btPw" target="_blank" rel="noopener"
                    title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.tiktok.com/@OrphionMC_network" target="_blank" rel="noopener" title="TikTok"><i
                        class="fa-brands fa-tiktok"></i></a>
            </div>

            <div class="nav-center">
                <ul class="nav-links">
                    <li><a href="forum.html"><i class="fa fa-arrow-left"></i> Volver al Foro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="thread-view">
        <!-- Content injected via JS -->
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stats.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const API_URL = 'http://localhost:3000/api';
            const params = new URLSearchParams(window.location.search);
            const threadId = params.get('id');
            const container = document.getElementById('thread-view');

            if (!threadId) return window.location.href = 'forum.html';

            try {
                const res = await fetch(`${API_URL}/threads/${threadId}`);
                const data = await res.json();

                if (!res.ok) {
                    container.innerHTML = `<h1 style="text-align:center; margin-top:100px; color:red;">${data.error || 'Error'}</h1>`;
                    return;
                }

                const { thread, posts } = data;
                document.title = `${thread.title} - OrphionMC`;

                let html = `
                    <header class="forum-hero gpu">
                        <h1>${thread.prefix ? `<span class="tag-prefix" style="font-size: 0.5em; vertical-align:middle;">${thread.prefix}</span> ` : ''}${thread.title}</h1>
                        <div class="meta">
                            En <a href="view_category.html?id=${thread.category_id}" style="color:var(--gold);">${thread.category_name}</a> • 
                            Iniciado por ${thread.author_name} • ${new Date(thread.created_at).toLocaleString()}
                        </div>
                    </header>
                    <div class="thread-container">
                        <!-- Main Thread Content -->
                        <div class="post">
                            <div class="post-user">
                                <div class="post-avatar"></div>
                                <span class="post-username">${thread.author_name}</span>
                                <span class="post-role">${thread.author_role}</span>
                            </div>
                            <div class="post-content">
                                ${formatContent(thread.content)}
                            </div>
                            <div class="post-footer">
                                <span>#1</span>
                                <span>${new Date(thread.created_at).toLocaleString()}</span>
                            </div>
                        </div>

                        <!-- Replies -->
                `;

                posts.forEach((p, index) => {
                    html += `
                        <div class="post">
                            <div class="post-user">
                                <div class="post-avatar"></div>
                                <span class="post-username">${p.username}</span>
                                <span class="post-role">${p.role}</span>
                            </div>
                            <div class="post-content">
                                ${formatContent(p.content)}
                            </div>
                            <div class="post-footer">
                                <span>#${index + 2}</span>
                                <span>${new Date(p.created_at).toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                });

                // Reply Box
                const user = localStorage.getItem('user');
                if (user) {
                    html += `
                        <div class="reply-box">
                            <h3>Responder</h3>
                            <textarea id="reply-content" placeholder="Escribe tu respuesta..."></textarea>
                            <button class="btn-reply" id="btn-send-reply">ENVIAR RESPUESTA</button>
                        </div>
                    `;
                } else {
                    html += `<div style="text-align:center; margin-top:50px; color:#888;"><a href="login.html" style="color:var(--gold)">Inicia sesión</a> para responder.</div>`;
                }

                html += `</div>`;
                container.innerHTML = html;

                // Add Event Listener to Reply Button
                const btnReply = document.getElementById('btn-send-reply');
                if (btnReply) {
                    btnReply.addEventListener('click', async () => {
                        const content = document.getElementById('reply-content').value;
                        if (!content.trim()) return alert("Escribe algo.");

                        try {
                            const postRes = await fetch(`${API_URL}/threads/${threadId}/posts`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ content }),
                                credentials: 'include'
                            });
                            if (postRes.ok) {
                                window.location.reload();
                            } else {
                                alert("Error al enviar respuesta");
                            }
                        } catch (e) { console.error(e); }
                    });
                }

            } catch (e) {
                container.innerHTML = '<p>Error fatal cargando el tema.</p>';
                console.error(e);
            }
        });

        function formatContent(text) {
            if (!text) return '';
            // 1. Escape HTML
            const safeText = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            // 2. Format newlines
            return safeText.replace(/\n/g, '<br>');
        }
    </script>
</body>

</html>
