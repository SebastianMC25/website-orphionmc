<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - OrphionMC</title>
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-header {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #333;
            padding: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
        }

        .profile-info h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #fff;
        }

        .profile-meta {
            color: #888;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .profile-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            border-radius: 6px;
        }

        .tab-btn.active {
            color: var(--gold);
            background: #1a1a1a;
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            background: #111;
        }

        .activity-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .activity-card:hover {
            border-color: #444;
            transform: translateX(5px);
        }

        .activity-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #eee;
            text-decoration: none;
            display: block;
        }

        .activity-details {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        .staff-tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            border: 1px solid var(--gold);
            margin-left: 10px;
        }

        .badge-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .status-open {
            background: #2e7d32;
            color: #fff;
        }

        .status-closed {
            background: #c62828;
            color: #fff;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .profile-tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body class="section-bg-dark">
    <!-- Navbar injected by auth.js -->
    <nav class="navbar" id="main-nav">
        <div class="navbar-container">
            <!-- Socials Left -->
            <div class="navbar-socials">
                <a href="https://discord.gg/orphionmc" target="_blank" rel="noopener" title="Discord"><i
                        class="fa-brands fa-discord"></i></a>
                <a href="https://www.youtube.com/channel/UCxnTxY8q4eg3RpkwvY2btPw" target="_blank" rel="noopener"
                    title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.tiktok.com/@OrphionMC_network" target="_blank" rel="noopener" title="TikTok"><i
                        class="fa-brands fa-tiktok"></i></a>
            </div>

            <div class="nav-container">
                <a href="index.html" class="logo"
                    style="text-decoration: none; color: var(--gold); font-family: 'MedievalSharp', cursive; font-size: 1.5rem;">OrphionMC</a>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="forum.html">Foro</a></li>
                </ul>
            </div>
    </nav>

    <div class="container" style="margin-top: 120px;">
        <div id="profile-loader" style="text-align: center; padding: 50px;">
            <i class="fa fa-spinner fa-spin fa-3x" style="color: var(--gold);"></i>
        </div>

        <div id="profile-content" style="display: none;">
            <!-- Header -->
            <div class="profile-header">
                <img src="assets/default-avatar.png" id="p-avatar" class="profile-avatar">
                <div class="profile-info">
                    <h1 id="p-username">Cargando...</h1>
                    <div id="p-badge-container"></div>
                    <div class="profile-meta">
                        <span><i class="fa fa-calendar"></i> Miembro desde: <span id="p-joined">-</span></span>
                        <span style="margin-left: 20px;"><i class="fa fa-clock"></i> Última vez: <span
                                id="p-active">-</span></span>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="profile-tabs">
                <button class="tab-btn active" onclick="switchTab('posts')">Temas</button>
                <button class="tab-btn" onclick="switchTab('replies')">Respuestas</button>
                <button class="tab-btn" onclick="switchTab('notifications')" id="tab-notif"
                    style="display: none;">Notificaciones</button>
            </div>

            <!-- Tab Content -->
            <div id="tab-posts" class="tab-section">
                <div id="posts-list"></div>
            </div>
            <div id="tab-replies" class="tab-section" style="display: none;">
                <div id="replies-list"></div>
            </div>
            <div id="tab-notifications" class="tab-section" style="display: none;">
                <div id="notif-list"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let targetUserId = params.get('id');
        let currentUser = null;

        async function initProfile() {
            currentUser = await checkAuth();
            if (!targetUserId && currentUser) targetUserId = currentUser.id;
            if (!targetUserId) { window.location.href = 'login.html'; return; }

            try {
                const user = await fetch(`${window.CONFIG.API_BASE}/users/${targetUserId}`).then(r => r.json());
                if (user.error) throw new Error(user.error);

                renderBasicInfo(user);
                loadActivity('posts');

                // If viewing own profile, show notifications tab
                if (currentUser && currentUser.id == targetUserId) {
                    document.getElementById('tab-notif').style.display = 'block';
                }

                document.getElementById('profile-loader').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';
            } catch (e) {
                alert("Usuario no encontrado");
                window.location.href = 'forum.html';
            }
        }

        function renderBasicInfo(user) {
            document.getElementById('p-username').innerText = user.username;
            document.getElementById('p-joined').innerText = new Date(user.created_at).toLocaleDateString();
            document.getElementById('p-active').innerText = user.last_activity ? new Date(user.last_activity).toLocaleString() : 'Nunca';

            if (user.avatar_url) document.getElementById('p-avatar').src = user.avatar_url;
            else if (user.minecraft_ign) document.getElementById('p-avatar').src = `https://mc-heads.net/avatar/${user.minecraft_ign}`;

            const badgeCont = document.getElementById('p-badge-container');
            const roleClass = `badge-${user.role}`;
            badgeCont.innerHTML = `<span class="badge ${roleClass}">${user.role.toUpperCase()}</span>`;
            if (user.minecraft_ign) {
                badgeCont.innerHTML += `<span class="badge" style="background:#555; margin-left:10px;"><i class="fa fa-cube"></i> ${user.minecraft_ign}</span>`;
            }
        }

        async function loadActivity(type) {
            const list = document.getElementById(`${type}-list`);
            list.innerHTML = '<p style="color:#666">Cargando actividad...</p>';

            try {
                const data = await fetch(`${window.CONFIG.API_BASE}/users/${targetUserId}/${type}`).then(r => r.json());

                if (type === 'posts') {
                    list.innerHTML = data.map(t => {
                        const safeTitle = window.escapeHTML(t.title);
                        const safeCat = window.escapeHTML(t.category_name);
                        const safeStatus = window.escapeHTML(t.status);
                        const safeId = encodeURIComponent(t.id);
                        return `
                            <div class="activity-card">
                                <a href="view_thread.html?id=${safeId}" class="activity-title">${safeTitle}</a>
                                <div class="activity-details">
                                    <span class="badge-status status-${safeStatus}">${safeStatus}</span>
                                    En <b>${safeCat}</b> • ${new Date(t.created_at).toLocaleDateString()}
                                    ${t.staff_replies > 0 ? '<span class="staff-tag"><i class="fa fa-award"></i> Respondido por Staff</span>' : ''}
                                </div>
                            </div>
                        `;
                    }).join('') || '<p>No ha creado temas aún.</p>';
                } else if (type === 'replies') {
                    list.innerHTML = data.map(p => {
                        const safeThreadTitle = window.escapeHTML(p.thread_title);
                        const safeSnippet = window.escapeHTML(p.content ? p.content.substring(0, 100) : '');
                        const safeThreadId = encodeURIComponent(p.thread_id);
                        const safePostId = encodeURIComponent(p.id);
                        return `
                            <div class="activity-card">
                                <a href="view_thread.html?id=${safeThreadId}#post-${safePostId}" class="activity-title">Re: ${safeThreadTitle}</a>
                                <div class="activity-details">
                                    <p style="margin: 5px 0; color:#aaa; font-style:italic;">"${safeSnippet}..."</p>
                                    <span>${new Date(p.created_at).toLocaleString()}</span>
                                </div>
                            </div>
                        `;
                    }).join('') || '<p>No ha realizado respuestas aún.</p>';
                } else if (type === 'notifications') {
                    const notifs = await fetch(`${window.CONFIG.API_BASE}/notifications`, { credentials: 'include' }).then(r => r.json());
                    list.innerHTML = notifs.map(n => {
                        let msg = 'Nueva notificación';
                        try {
                            const d = JSON.parse(n.data);
                            msg = d.message || msg;
                        } catch(e) {}
                        const safeMsg = window.escapeHTML(msg);
                        return `
                            <div class="activity-card ${n.is_read ? '' : 'unread'}" style="border-left: 4px solid ${n.is_read ? '#333' : 'var(--gold)'}">
                                <div class="activity-title">${safeMsg}</div>
                                <div class="activity-details">${new Date(n.created_at).toLocaleString()}</div>
                            </div>
                        `;
                    }).join('') || '<p>No tienes notificaciones.</p>';
                }
            } catch (e) {
                list.innerHTML = '<p style="color:red">Error al cargar datos.</p>';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).style.display = 'block';
            event.target.classList.add('active');

            loadActivity(tabId);
        }

        initProfile();
    </script>
</body>

</html>
