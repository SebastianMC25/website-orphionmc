<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado - OrphionMC</title>
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(30, 0, 0, 0.4) 0%, transparent 70%);
        }

        .error-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(11, 11, 11, 0.9);
            border: 2px solid var(--brown);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .error-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #8b0000, transparent);
        }

        .error-icon {
            font-size: 5rem;
            color: #8b0000;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(139, 0, 0, 0.5));
        }

        .error-code {
            font-family: "MedievalSharp", cursive;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .error-message {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .error-btn {
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-home {
            background: var(--gold);
            color: #000;
            border: 1px solid var(--gold);
        }

        .btn-home:hover {
            background: #000;
            color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(245, 197, 66, 0.3);
        }

        .btn-profile {
            background: transparent;
            color: var(--text-main);
            border: 1px solid #444;
        }

        .btn-profile:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .error-actions {
                flex-direction: column;
            }
            .error-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="video-bg"></div>

    <main class="error-page">
        <div class="error-container">
            <div class="error-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <div class="error-code">403 - ACCESO RESTRINGIDO</div>
            <p class="error-message">
                Tus pergaminos no tienen los sellos necesarios para entrar en esta sección del reino. 
                Si crees que esto es un error, contacta con un administrador.
            </p>
            <div class="error-actions">
                <a href="index.html" class="error-btn btn-home">
                    <i class="fas fa-home"></i> Volver al Inicio
                </a>
                <a href="https://discord.orphionmc.net" target="_blank" rel="noopener" class="error-btn btn-profile">
                    <i class="fa-brands fa-discord"></i> Soporte Discord
                </a>
            </div>
        </div>
    </main>
</body>
</html>
