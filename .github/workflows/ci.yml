name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        run: |
          cd server
          npm ci || npm install
          cd ..

      - name: Validate Server Syntax
        run: |
          node -c server/server.js
          node -c server/backup.js
          node -c server/core/api.js
          node -c server/core/db.js
          node -c server/core/forum.js
          node -c server/core/main.js
          node -c server/core/discord_auth.js
          node -c server/core/security_logic.js
          node -c build.js

      - name: Run Production Build
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html
          test -f dist/forum.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          echo "Production build verified successfully!"
