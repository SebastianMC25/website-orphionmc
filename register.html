<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - OrphionMC</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-top: 3px solid var(--gold);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .auth-logo {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
        }

        .auth-title {
            color: #fff;
            margin-bottom: 30px;
            font-family: 'Cinzel', serif;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: var(--gold);
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: filter 0.3s;
            font-family: 'Cinzel', serif;
        }

        .btn-auth:hover {
            filter: brightness(1.1);
        }

        .auth-links {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--gold);
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ff5555;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
            pointer-events: none;
            background: #000 url('assets/images/poster.png') no-repeat center center / cover;
        }
    </style>
</head>

<body>
    <div class="video-bg"></div>

    <div class="auth-container">
        <a href="index.html" class="auth-logo">OrphionMC</a>
        <h2 class="auth-title">Crear Cuenta</h2>

        <div id="error-box" class="error-msg"></div>

        <form id="register-form">
            <!-- Honeypot field (hidden from humans) -->
            <div style="display: none;">
                <label>Si ves esto, no rellenes nada</label>
                <input type="text" id="website_field" name="website_field" autocomplete="off">
            </div>
            <input type="hidden" id="antibot_token" name="antibot_token">

            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico (Opcional, para recuperar cuenta)</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirm-password" required>
            </div>
            <button type="submit" class="btn-auth">REGISTRARSE</button>
        </form>

        <div class="auth-links">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
            <p><a href="forum.html">Volver al Foro</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
